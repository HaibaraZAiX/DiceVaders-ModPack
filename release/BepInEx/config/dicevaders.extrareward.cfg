## Settings file was created by plugin DiceVaders Extra Reward Option v1.0.0
## Plugin GUID: dicevaders.extrareward

[1-开关]

## 把幕奖励（专长选择）的选项数量从 3 增加到 4。
## ★ 想保持三选一的话把它关掉 —— 关掉只停用数量补丁，不影响下面的「开局自动弹出」。
# Setting type: Boolean
# Default value: true
Enabled = false

## 目标选项数量。原版是 3。填 3 = 不改。
# Setting type: Int32
# Default value: 3
# Acceptable value range: From 3 to 6
OptionCount = 3

[2-开局自动弹出]

## 开局自动弹出专长三选一面板（不用打幕、也不用按热键）。
# Setting type: Boolean
# Default value: true
AutoOpenOnRunStart = true

## 开新局后等多少秒再弹。
## ★ 别设太小：开局有一长串初始化 task 在跑。
# Setting type: Single
# Default value: 6
# Acceptable value range: From 1 to 30
AutoOpenDelay = 6

[3-测试]

## 额外保留一个热键，随时手动弹出面板。
# Setting type: Boolean
# Default value: true
TestHotkey = true

## 触发测试面板的按键。可填 Z / X / C / V / F1~F12。
## ★ 游戏占用了 F2（Bug 报告），别填 F2。
# Setting type: String
# Default value: Z
TestKey = Z

