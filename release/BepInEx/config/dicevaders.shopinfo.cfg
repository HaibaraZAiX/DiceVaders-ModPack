## Settings file was created by plugin DiceVaders ShopInfo v1.0.2
## Plugin GUID: dicevaders.shopinfo

[1-显示]

## 显示商店出货概率面板。
# Setting type: Boolean
# Default value: true
ShowPanel = true

## 左列距屏幕左边缘像素。
# Setting type: Single
# Default value: 520
# Acceptable value range: From 0 to 900
OffsetX = 520

## 右列距屏幕右边缘像素（默认 460，落在「发射！」按钮左边）。
# Setting type: Single
# Default value: 560
# Acceptable value range: From 0 to 900
RightOffsetX = 560

## 两列距屏幕底部像素。
# Setting type: Single
# Default value: 280
# Acceptable value range: From 0 to 900
OffsetY = 280

## 字号。
# Setting type: Single
# Default value: 15
# Acceptable value range: From 8 to 40
FontSize = 15

## 在右侧显示神器物品的稀有度概率（与左侧商品棋子共用同一套曲线）。
# Setting type: Boolean
# Default value: true
ShowArtifactProbs = true

## 显示隐藏的对局数值（全局倍率 / 怒气 / 兽化回合 / 蜂群倍率 / 献祭% / 增益% / 最终BOSS血量 / 跳过量）。
## ★ 只在数值非零时显示，全为零时这一块会整体隐藏，不占地方。
# Setting type: Boolean
# Default value: false
ShowHiddenValues = false

## 隐藏数值块距屏幕底部像素（它在左列上方）。
# Setting type: Single
# Default value: 300
# Acceptable value range: From 0 to 900
HiddenValuesOffsetY = 300

## 在右列底部显示「星界」出现概率。
## ★ 星界是独立的一次掷骰（在选秀格上判定），不占四档概率之和，所以单独列出。
##    依据：DraftChoice.Initialize 的 astralChance 参数，DraftPanel.CreateNewDraft 传常量 0.02。
# Setting type: Boolean
# Default value: true
ShowAstral = true

[2-调试]

## 权重基数变化时在日志里打印一行，方便对照游戏内数值。
# Setting type: Boolean
# Default value: true
LogOnRarityChange = true

