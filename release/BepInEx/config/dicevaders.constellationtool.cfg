## Settings file was created by plugin DiceVaders Constellation Tool v3.4.2
## Plugin GUID: dicevaders.constellationtool

[0-开关]

## 星座刷新功能总开关。也可以在游戏的「沙盒设置」面板里切换。
# Setting type: Boolean
# Default value: true
Enabled = true

[1-按钮]

## 克隆游戏原生按钮做「重掷星座」按钮。
# Setting type: Boolean
# Default value: true
UseNativeButton = true

## 右上角锚点时：距屏幕右边缘像素。
# Setting type: Single
# Default value: 60
# Acceptable value range: From 0 to 800
RightOffset = 60

## 右上角锚点时：距屏幕顶部像素。
# Setting type: Single
# Default value: 300
# Acceptable value range: From 0 to 1000
TopOffset = 430

## true=靠右侧（默认）；false=靠左侧。
# Setting type: Boolean
# Default value: true
AnchorRight = true

## 配合 AnchorRight 决定四角：右+底=右下角（默认）/ 右+顶=右上角 / 左+底=左下角。右下角与右上角都读 RightOffset；右下角用 BottomOffset，右上角用 TopOffset。
# Setting type: Boolean
# Default value: true
AnchorBottom = true

## 左下角锚点时：距屏幕左边缘像素。
# Setting type: Single
# Default value: 120
# Acceptable value range: From 0 to 1200
LeftOffset = 120

## 左下角锚点时：距屏幕底部像素（「星座系统」上方）。
# Setting type: Single
# Default value: 235
# Acceptable value range: From 0 to 1200
BottomOffset = 120

## 主按钮宽度（高度自动按游戏原版长宽比跟随，不单独设置 —— 原版按钮的上下边框是独立子对象、按原高度定位，压缩高度会把边框挤出可见区）。
# Setting type: Single
# Default value: 350
# Acceptable value range: From 100 to 700
Width = 350

## 自建按钮的字号，0=沿用取到的原字号。
# Setting type: Single
# Default value: 42
# Acceptable value range: From 0 to 120
FontSize = 42

## 显示 3 个单项刷新按钮，各自贴在对应星座卡片下方。关掉则只有「刷新全部」。
# Setting type: Boolean
# Default value: true
EnableSingleReroll = true

## 单项刷新按钮的宽度（高度同样按比例跟随）。
# Setting type: Single
# Default value: 170
# Acceptable value range: From 50 to 400
SingleButtonWidth = 170

Height = 76

[2-调试]

## 每次进星座界面时打印场景里的按钮候选清单（便于排查）。
# Setting type: Boolean
# Default value: true
LogCandidates = true

## 显示屏幕左上角的调试面板（兜底用）。默认关。
# Setting type: Boolean
# Default value: false
ShowDebugPanel = false

## 进入星座场景时自动 dump 状态到日志。
# Setting type: Boolean
# Default value: true
AutoDumpOnSceneOpen = true

## 重掷后等待多久再补详情（秒）。
# Setting type: Single
# Default value: 0.65
# Acceptable value range: From 0 to 5
DetailRestoreDelay = 0.65

[3-安全]

## 单次停留在星座界面的最大重掷次数。防止 CreateConstellations() 反复追加数据把本局搞崩。
# Setting type: Int32
# Default value: 20
# Acceptable value range: From 1 to 200
MaxRerollPerSession = 20

