## Settings file was created by plugin DiceVaders Infinite Resources v2.0.1
## Plugin GUID: dicevaders.resourcebuttons

[1-开关]

## 开启无限资源。也可以在游戏的「沙盒设置」面板里切换。
# Setting type: Boolean
# Default value: true
Enabled = true

## 无限时空点（ChronoToken）。
# Setting type: Boolean
# Default value: true
GiveChrono = true

## 无限挪移（BudgeToken）。
# Setting type: Boolean
# Default value: true
GiveBudge = true

[2-数量]

## 时空点维持的目标值。
# Setting type: Int32
# Default value: 10
# Acceptable value range: From 1 to 999
ChronoAmount = 10

## 挪移维持的目标值。
# Setting type: Int32
# Default value: 10
# Acceptable value range: From 1 to 999
BudgeAmount = 10

## 目标值以上也压回目标（默认开）。
## 关掉的话只在「减少到低于目标」时补，已经超过目标时不动它。
# Setting type: Boolean
# Default value: true
CapAbove = true

[3-调试]

## 轮询间隔（秒）。越小反应越快，越大越省。
## 默认 0.05 = 每秒查 20 次，花掉的资源几乎瞬间回满。
# Setting type: Single
# Default value: 0.05
# Acceptable value range: From 0 to 1
PollSeconds = 0.05

## 每次补回写一行日志。默认开 —— 出问题时读日志就能定位。
# Setting type: Boolean
# Default value: true
LogOnRefill = true

